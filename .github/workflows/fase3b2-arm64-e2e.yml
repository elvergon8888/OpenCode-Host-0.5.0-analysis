name: Fase 3B-2 ARM64 E2E Tests

on:
  workflow_dispatch:
    inputs:
      apk_sha256:
        description: 'SHA-256 del APK a probar'
        required: true
        default: '554762ca25618e124189c36b72c598cdaabc2382ada349f6e44bb1a221731089'
      test_release:
        description: 'Crear release de prueba con APK'
        required: false
        type: boolean
        default: false
      apk_source_url:
        description: 'URL directa al APK (GitHub Release asset o artefacto HTTP directo)'
        required: true
        default: ''
      run_firebase_tests:
        description: 'Ejecutar Firebase Test Lab (requiere secrets y autorización de costos)'
        required: false
        type: boolean
        default: false

env:
  APK_NAME: OpenCode-Host-0.5.0-fase3b-parallel.apk
  EXPECTED_PACKAGE_ID: app.opencodehost.fase3b
  EXPECTED_ABI: arm64-v8a
  EXPECTED_SHA256: 554762ca25618e124189c36b72c598cdaabc2382ada349f6e44bb1a221731089
  EMULATOR_API: 30
  EMULATOR_ARCH: arm64

jobs:
# ===================================================================
# 0. DESCARGAR Y VERIFICAR APK (OBLIGATORIO, SIEMPRE SE EJECUTA)
# ===================================================================
  fetch-and-verify-apk:
    name: Descargar y verificar APK (obligatorio)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apk_path: ${{ steps.download_apk.outputs.apk_path }}
      package: ${{ steps.apk_info.outputs.package }}
      version_code: ${{ steps.apk_info.outputs.version_code }}
      version_name: ${{ steps.apk_info.outputs.version_name }}
      min_sdk: ${{ steps.apk_info.outputs.min_sdk }}
      target_sdk: ${{ steps.apk_info.outputs.target_sdk }}
      abi: ${{ steps.apk_info.outputs.abi }}
      sha256: ${{ steps.verify_sha.outputs.sha256 }}
    steps:
      - name: Validar entradas
        env:
          APK_SOURCE_URL: ${{ github.event.inputs.apk_source_url }}
        run: |
          if [ -z "$APK_SOURCE_URL" ]; then
            echo "ERROR: apk_source_url requerido"
            exit 1
          fi
          echo "APK URL: $APK_SOURCE_URL"

      - name: Descargar APK desde URL verificable
        id: download_apk
        env:
          APK_SOURCE_URL: ${{ github.event.inputs.apk_source_url }}
        run: |
          APK_URL="$APK_SOURCE_URL"
          echo "Descargando APK desde: $APK_URL"
          wget -q --show-progress "$APK_URL" -O "${{ env.APK_NAME }}"
          
          if [ ! -f "${{ env.APK_NAME }}" ]; then
            echo "ERROR: Descarga fallida"
            exit 1
          fi
          echo "apk_path=${{ env.APK_NAME }}" >> $GITHUB_OUTPUT
          echo "✅ APK descargado"

      - name: Verificar SHA-256 del APK (OBLIGATORIO)
        id: verify_sha
        env:
          EXPECTED_SHA256: ${{ github.event.inputs.apk_sha256 }}
        run: |
          CALCULATED=$(sha256sum "${{ env.APK_NAME }}" | cut -d' ' -f1)
          EXPECTED="$EXPECTED_SHA256"
          echo "Calculado: $CALCULATED"
          echo "Esperado:  $EXPECTED"
          if [ "$CALCULATED" != "$EXPECTED" ]; then
            echo "ERROR: SHA-256 NO COINCIDE - ABORTANDO"
            exit 1
          fi
          echo "sha256=$CALCULATED" >> $GITHUB_OUTPUT
          echo "✅ SHA-256 VERIFICADO"

      - name: Extraer información del APK (pruebas estáticas)
        id: apk_info
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq android-sdk-build-tools >/dev/null 2>&1
          PACKAGE=$(aapt2 dump badging "${{ env.APK_NAME }}" | grep -oP "package: name='\K[^']+")
          VERSION_CODE=$(aapt2 dump badging "${{ env.APK_NAME }}" | grep -oP "versionCode='\K[^']+")
          VERSION_NAME=$(aapt2 dump badging "${{ env.APK_NAME }}" | grep -oP "versionName='\K[^']+")
          MIN_SDK=$(aapt2 dump badging "${{ env.APK_NAME }}" | grep -oP "minSdkVersion:'\K[^']+")
          TARGET_SDK=$(aapt2 dump badging "${{ env.APK_NAME }}" | grep -oP "targetSdkVersion:'\K[^']+")
          ABI=$(aapt2 dump badging "${{ env.APK_NAME }}" | grep -oP "native-code: '\K[^']+")
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "min_sdk=$MIN_SDK" >> $GITHUB_OUTPUT
          echo "target_sdk=$TARGET_SDK" >> $GITHUB_OUTPUT
          echo "abi=$ABI" >> $GITHUB_OUTPUT
          echo "=== PRUEBAS ESTÁTICAS APK ==="
          echo "Package: $PACKAGE"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "SDK: $MIN_SDK - $TARGET_SDK"
          echo "ABI: $ABI"
          echo "SHA-256: ${{ steps.verify_sha.outputs.sha256 }}"

      - name: Validar Package ID y ABI esperados
        env:
          EXPECTED_PACKAGE_ID: ${{ env.EXPECTED_PACKAGE_ID }}
          EXPECTED_ABI: ${{ env.EXPECTED_ABI }}
        run: |
          if [ "${{ steps.apk_info.outputs.package }}" != "${{ env.EXPECTED_PACKAGE_ID }}" ]; then
            echo "ERROR: Package ID no coincide. Esperado: ${{ env.EXPECTED_PACKAGE_ID }}, Obtenido: ${{ steps.apk_info.outputs.package }}"
            exit 1
          fi
          if [ "${{ steps.apk_info.outputs.abi }}" != "${{ env.EXPECTED_ABI }}" ]; then
            echo "ERROR: ABI no coincide. Esperado: ${{ env.EXPECTED_ABI }}, Obtenido: ${{ steps.apk_info.outputs.abi }}"
            exit 1
          fi
          echo "✅ Package ID y ABI validados"

      - name: Subir APK como artifact para jobs posteriores
        uses: actions/upload-artifact@v4
        with:
          name: apk-test-asset
          path: ${{ env.APK_NAME }}
          retention-days: 7

# ===================================================================
# 2. PRUEBAS ESTÁTICAS (x86_64 - SIN EJECUCIÓN NATIVA, SIEMPRE)
# ===================================================================
  static-tests:
    name: Pruebas Estáticas APK (x86_64)
    needs: fetch-and-verify-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar APK del artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-test-asset
          path: /tmp/

      - name: Verificar SHA-256 (obligatorio)
        env:
          EXPECTED_SHA256: ${{ needs.fetch-and-verify-apk.outputs.sha256 }}
        run: |
          CALCULATED=$(sha256sum "/tmp/${{ env.APK_NAME }}" | cut -d' ' -f1)
          if [ "$CALCULATED" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: SHA-256 mismatch"
            exit 1
          fi
          echo "✅ SHA-256 OK"

      - name: Verificar metadatos APK (aapt2)
        run: |
          aapt2 dump badging "/tmp/${{ env.APK_NAME }}"

      - name: Verificar contenido lib/arm64-v8a/
        run: |
          unzip -l "/tmp/${{ env.APK_NAME }}" "lib/arm64-v8a/*"

      - name: Validar Package ID y ABI en pruebas estáticas
        env:
          EXPECTED_PACKAGE_ID: ${{ env.EXPECTED_PACKAGE_ID }}
          EXPECTED_ABI: ${{ env.EXPECTED_ABI }}
        run: |
          PACKAGE=$(aapt2 dump badging "/tmp/${{ env.APK_NAME }}" | grep -oP "package: name='\K[^']+")
          ABI=$(aapt2 dump badging "/tmp/${{ env.APK_NAME }}" | grep -oP "native-code: '\K[^']+")
          if [ "$PACKAGE" != "${{ env.EXPECTED_PACKAGE_ID }}" ]; then
            echo "ERROR: Package ID no coincide en pruebas estáticas"
            exit 1
          fi
          if [ "$ABI" != "${{ env.EXPECTED_ABI }}" ]; then
            echo "ERROR: ABI no coincide en pruebas estáticas"
            exit 1
          fi
          echo "✅ Package ID y ABI validados en pruebas estáticas"

      - name: Verificar contenido lib/arm64-v8a/ (librg.so presente)
        run: |
          unzip -l "/tmp/${{ env.APK_NAME }}" "lib/arm64-v8a/*" | grep -q "librg.so"
          if [ $? -ne 0 ]; then
            echo "ERROR: librg.so no encontrado en lib/arm64-v8a/"
            exit 1
          fi
          echo "✅ librg.so presente en lib/arm64-v8a/"

      - name: Documentar limitación
        run: |
          echo "=== PRUEBAS ESTÁTICAS EN x86_64 ==="
          echo "✅ SHA-256 verificado"
          echo "✅ Manifest parseado"
          echo "✅ ABI arm64-v8a confirmado"
          echo "✅ librg.so presente en lib/arm64-v8a/"
          echo ""
          echo "⚠️ ESTAS PRUEBAS NO EJECUTAN CÓDIGO NATIVO ARM64"
          echo "⚠️ NO VERIFICAN: carga librerías, W^X, SELinux, funcionalidad motor"

# ===================================================================
# 3. CREAR RELEASE (OPCIONAL, SOLO SI test_release=true)
# ===================================================================
  prepare-release:
    name: Preparar Release (opcional)
    needs: fetch-and-verify-apk
    if: github.event.inputs.test_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar APK del artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-test-asset
          path: .

      - name: Verificar SHA-256 (doble verificación)
        env:
          EXPECTED_SHA256: ${{ needs.fetch-and-verify-apk.outputs.sha256 }}
        run: |
          CALCULATED=$(sha256sum "${{ env.APK_NAME }}" | cut -d' ' -f1)
          if [ "$CALCULATED" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: SHA-256 mismatch"
            exit 1
          fi
          echo "✅ SHA-256 OK"

      - name: Crear Release de prueba (draft, prerelease)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "fase3b2-test-${{ github.run_number }}"
          name: "Fase 3B-2 Test Release - ${{ env.APK_NAME }}"
          body: |
            ## Fase 3B-2 APK Paralelo para Pruebas E2E
            
            **APK:** `${{ env.APK_NAME }}`
            **Package ID:** `${{ needs.fetch-and-verify-apk.outputs.package }}`
            **Version:** `${{ needs.fetch-and-verify-apk.outputs.version_name }}` (code: `${{ needs.fetch-and-verify-apk.outputs.version_code }}`)
            **Min SDK:** `${{ needs.fetch-and-verify-apk.outputs.min_sdk }}`
            **Target SDK:** `${{ needs.fetch-and-verify-apk.outputs.target_sdk }}`
            **ABI:** `${{ needs.fetch-and-verify-apk.outputs.abi }}`
            **SHA-256:** `${{ needs.fetch-and-verify-apk.outputs.sha256 }}`
            
            ### Instalación
            ```bash
            adb install ${{ env.APK_NAME }}
            ```
            
            ### Validación
            ```bash
            # Verificar instalación
            adb shell pm list packages ${{ needs.fetch-and-verify-apk.outputs.package }}
            
            # Verificar librg.so
            adb shell ls -la /data/app/${{ needs.fetch-and-verify-apk.outputs.package }}*/lib/arm64/librg.so
            ```
            
            ⚠️ **Nota:** Variante de prueba (`app.opencodehost.fase3b`) que convive con app original (`app.opencodehost`).
          draft: true
          prerelease: true
          files: |
            ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ===================================================================
# 4. VERIFICAR CAPACIDADES ARM64 (EN RUNNER ARM64 REAL)
# ===================================================================
  check-arm64-capabilities:
    name: Verificar capacidades reales en runner ARM64
    needs: fetch-and-verify-apk
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    outputs:
      kvm_available: ${{ steps.check_kvm.outputs.kvm_available }}
      tcg_mode_possible: ${{ steps.check_tcg.outputs.tcg_mode_possible }}
      android_emulator_arm64: ${{ steps.check_emulator.outputs.android_emulator_arm64 }}
      firebase_testlab_configured: ${{ steps.check_firebase.outputs.firebase_testlab_configured }}
    steps:
      - name: Verificar arquitectura y KVM
        id: check_kvm
        run: |
          echo "=== Verificación KVM en runner ARM64 ==="
          uname -a
          lscpu | grep -E "Architecture|CPU\(s\)|Model name|Virtualization|Hypervisor"
          
          if [ -e /dev/kvm ]; then
            echo "kvm_available=true" >> $GITHUB_OUTPUT
            echo "✅ /dev/kvm DISPONIBLE"
            ls -la /dev/kvm
          else
            echo "kvm_available=false" >> $GITHUB_OUTPUT
            echo "❌ /dev/kvm NO DISPONIBLE"
          fi

      - name: Investigar QEMU TCG (emulación por software sin KVM)
        id: check_tcg
        run: |
          echo "=== Investigando QEMU TCG (emulación software) ==="
          
          if command -v qemu-system-aarch64 &> /dev/null; then
            echo "qemu-system-aarch64 disponible"
            qemu-system-aarch64 --version
            
            qemu-system-aarch64 -accel help 2>&1 | grep -E "tcg|kvm|hvf|whpx|hax"
            
            echo "tcg_mode_possible=true" >> $GITHUB_OUTPUT
            echo "✅ QEMU TCG (emulación software) DISPONIBLE"
            echo "⚠️ LIMITACIÓN: TCG es MUY LENTO (10-50x más lento que KVM)"
            echo "⚠️ Android ARM64 en TCG: tiempo de arranque > 30 min, inusable para CI"
          else
            echo "tcg_mode_possible=false" >> $GITHUB_OUTPUT
            echo "❌ qemu-system-aarch64 NO instalado"
          fi

      - name: Verificar Android Emulator ARM64 oficial
        id: check_emulator
        run: |
          echo "=== Android Emulator ARM64 ==="
          
          echo "actions/android-emulator@v2: Solo imágenes x86_64"
          echo "Imágenes ARM64 system-images: Requieren emulador local + KVM"
          
          sudo apt-get update -qq && sudo apt-get install -y -qq android-sdk-build-tools >/dev/null 2>&1
          ANDROID_SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          cd "${ANDROID_SDK_ROOT}/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --licenses >/dev/null 2>&1
          
          sdkmanager "platform-tools" "emulator" >/dev/null 2>&1
          IMAGES=$(sdkmanager --list 2>&1 | grep "system-images.*arm64" | head -5)
          if [ -n "$IMAGES" ]; then
            echo "android_emulator_arm64=true" >> $GITHUB_OUTPUT
            echo "✅ Imágenes ARM64 disponibles en SDK:"
            echo "$IMAGES"
          else
            echo "android_emulator_arm64=false" >> $GITHUB_OUTPUT
            echo "❌ No hay imágenes ARM64 disponibles o requieren licencia"
          fi

      - name: Verificar configuración Firebase Test Lab
        id: check_firebase
        run: |
          echo "=== Firebase Test Lab ==="
          if [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ] && [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "firebase_testlab_configured=true" >> $GITHUB_OUTPUT
            echo "✅ Credenciales Firebase configuradas"
          else
            echo "firebase_testlab_configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Firebase Test Lab NO configurado (requiere secrets FIREBASE_PROJECT_ID y GCP_SA_KEY)"
            echo "Documentación: https://firebase.google.com/docs/test-lab"
          fi

      - name: Resumen capacidades reales
        run: |
          echo "=== RESUMEN CAPACIDADES REALES (Runner ARM64) ==="
          echo "KVM disponible: ${{ steps.check_kvm.outputs.kvm_available }}"
          echo "QEMU TCG (software): ${{ steps.check_tcg.outputs.tcg_mode_possible }}"
          echo "Android Emulator ARM64: ${{ steps.check_emulator.outputs.android_emulator_arm64 }}"
          echo "Firebase Test Lab: ${{ steps.check_firebase.outputs.firebase_testlab_configured }}"
          echo ""
          echo "CONCLUSIONES:"
          if [ "${{ steps.check_kvm.outputs.kvm_available }}" = "true" ]; then
            echo "✅ KVM DISPONIBLE -> Emulador ARM64 nativo POSIBLE"
          else
            echo "❌ KVM NO DISPONIBLE -> Emulador ARM64 nativo IMPOSIBLE"
            if [ "${{ steps.check_tcg.outputs.tcg_mode_possible }}" = "true" ]; then
              echo "⚠️ QEMU TCG disponible pero INUTILIZABLE para CI (demasiado lento)"
            fi
          fi
          if [ "${{ steps.check_firebase.outputs.firebase_testlab_configured }}" = "true" ]; then
            echo "✅ Firebase Test Lab CONFIGURADO -> Tests en dispositivos físicos ARM64 POSIBLES"
          fi

# ===================================================================
# 5. PRUEBAS FUNCIONALES EN RUNNER ARM64 (SOLO SI KVM DISPONIBLE)
# ===================================================================
  functional-tests-arm64:
    name: Pruebas Funcionales ARM64 (requiere KVM)
    needs: [check-arm64-capabilities, fetch-and-verify-apk]
    if: needs.check-arm64-capabilities.outputs.kvm_available == 'true'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    outputs:
      emulator_ready: ${{ steps.emulator_setup.outputs.emulator_ready }}
      apk_installed: ${{ steps.install_apk.outputs.apk_installed }}
      rg_native_ok: ${{ steps.test_rg.outputs.rg_native_ok }}
      fs_find_ok: ${{ steps.http_tests.outputs.fs_find_ok }}
      rg_native_ok_http: ${{ steps.http_tests.outputs.rg_native_ok }}
    steps:
      - name: Verificar KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: KVM no disponible en runner ARM64"
            exit 1
          fi
          echo "✅ KVM verificado"

      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: apk-test-asset
          path: /tmp/

      - name: Verificar SHA-256
        env:
          EXPECTED_SHA256: ${{ needs.fetch-and-verify-apk.outputs.sha256 }}
        run: |
          CALCULATED=$(sha256sum "/tmp/${{ env.APK_NAME }}" | cut -d' ' -f1)
          if [ "$CALCULATED" != "$EXPECTED_SHA256" ]; then
            exit 1
          fi

      - name: Configurar Android Emulator ARM64 (KVM)
        id: emulator_setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless unzip wget >/dev/null
          
          ANDROID_SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          cd "${ANDROID_SDK_ROOT}/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/emulator:${PATH}"
          
          yes | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager "platform-tools" "emulator" "platforms;android-${{ env.EMULATOR_API }}" "system-images;android-${{ env.EMULATOR_API }};default;${{ env.EMULATOR_ARCH }}" >/dev/null 2>&1
          
          echo "no" | avdmanager create avd -n test_arm64 -k "system-images;android-${{ env.EMULATOR_API }};default;${{ env.EMULATOR_ARCH }}" --force 2>&1
          
          # Arrancar emulador en background
          emulator -avd test_arm64 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -qemu -enable-kvm > /tmp/emulator.log 2>&1 &
          EMULATOR_PID=$!
          
          # Esperar dispositivo ADB
          echo "Esperando dispositivo ADB..."
          adb wait-for-device
          
          # Esperar boot (máx 120s)
          EMULATOR_READY=false
          for i in {1..60}; do
            if adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
              echo "✅ Emulador arrancado"
              EMULATOR_READY=true
              break
            fi
            sleep 2
          done
          
          # Verificar que el proceso del emulador sigue vivo
          if ! kill -0 $EMULATOR_PID 2>/dev/null; then
            echo "❌ Proceso del emulador murió"
            cat /tmp/emulator.log
            exit 1
          fi
          
          if [ "$EMULATOR_READY" = "true" ]; then
            echo "emulator_ready=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Emulador no arrancó en 120s"
            cat /tmp/emulator.log
            exit 1
          fi

      - name: Instalar APK en emulador
        id: install_apk
        run: |
          adb install -r "/tmp/${{ env.APK_NAME }}"
          # Verificar que el paquete está realmente instalado
          if adb shell pm list packages | grep -q "${{ env.EXPECTED_PACKAGE_ID }}"; then
            echo "apk_installed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Paquete no encontrado después de instalación"
            exit 1
          fi

      - name: Verificar librg.so instalado (archivo y ejecución)
        id: test_rg
        run: |
          # Verificar archivo
          LIB_PATH=$(adb shell ls /data/app/${{ env.EXPECTED_PACKAGE_ID }}*/lib/arm64/librg.so 2>/dev/null | head -1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ librg.so no encontrado en lib/arm64/"
            exit 1
          fi
          echo "✅ librg.so encontrado en: $LIB_PATH"
          
          # Ejecutar con run-as (contexto de la app)
          RG_OUTPUT=$(adb shell run-as ${{ env.EXPECTED_PACKAGE_ID }} "$LIB_PATH" --version 2>&1)
          RG_EXIT=$?
          echo "rg output: $RG_OUTPUT"
          echo "rg exit code: $RG_EXIT"
          
          if [ $RG_EXIT -eq 0 ] && echo "$RG_OUTPUT" | grep -q "ripgrep 15.1.0"; then
            echo "✅ ripgrep ejecutándose nativamente"
            echo "rg_native_ok=true" >> $GITHUB_OUTPUT
          else
            echo "❌ ripgrep no ejecuta nativamente (exit: $RG_EXIT)"
            echo "rg_native_ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verificar libopencode.so cargado
        run: |
          LIB_PATH=$(adb shell ls /data/app/${{ env.EXPECTED_PACKAGE_ID }}*/lib/arm64/libopencode.so 2>/dev/null | head -1)
          if [ -z "$LIB_PATH" ]; then
            echo "❌ libopencode.so no encontrado"
            exit 1
          fi
          echo "✅ libopencode.so encontrado en: $LIB_PATH"

      - name: Iniciar app y verificar servidor OpenCode
        id: start_app
        run: |
          # Obtener actividad de lanzamiento desde el manifest
          MAIN_ACTIVITY=$(adb shell pm resolve-activity --brief -n ${{ env.EXPECTED_PACKAGE_ID }}/.MainActivity 2>/dev/null | cut -d' ' -f1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            # Fallback: usar MainActivity conocido
            MAIN_ACTIVITY="${{ env.EXPECTED_PACKAGE_ID }}/.MainActivity"
          fi
          
          # Iniciar actividad principal
          adb shell am start -n "$MAIN_ACTIVITY" -a android.intent.action.MAIN -c android.intent.category.LAUNCHER
          
          # Esperar a que el servicio inicie (máx 30s)
          SERVER_READY=false
          for i in {1..30}; do
            # Usar wget o curl disponible en el dispositivo
            if adb shell "which curl" >/dev/null 2>&1; then
              HTTP_CMD="curl -s"
            elif adb shell "which wget" >/dev/null 2>&1; then
              HTTP_CMD="wget -qO-"
            else
              echo "❌ Ni curl ni wget disponibles en el dispositivo"
              exit 1
            fi
            
            if adb shell "timeout 5 $HTTP_CMD http://127.0.0.1:4096/api/info" 2>/dev/null | grep -q "version"; then
              echo "✅ Servidor OpenCode respondiendo en puerto 4096"
              SERVER_READY=true
              break
            fi
            sleep 2
          done
          
          if [ "$SERVER_READY" = "false" ]; then
            echo "❌ Servidor OpenCode no respondió en 60s"
            # Capturar logcat para diagnóstico
            adb logcat -d -s opencode > /tmp/logcat_server.txt 2>&1
            cat /tmp/logcat_server.txt
            exit 1
          fi
          
          # Verificar proceso
          adb shell ps -A | grep ${{ env.EXPECTED_PACKAGE_ID }} | head -5

      - name: Ejecutar pruebas HTTP reales (servidor OpenCode)
        id: http_tests
        run: |
          # Determinar cliente HTTP disponible en el dispositivo
          if adb shell "which curl" >/dev/null 2>&1; then
            HTTP_CMD="curl -s"
          elif adb shell "which wget" >/dev/null 2>&1; then
            HTTP_CMD="wget -qO-"
          else
            echo "❌ Ni curl ni wget disponibles en el dispositivo"
            exit 1
          fi
          
          # Test 1: /api/fs/find
          echo "=== Test /api/fs/find ==="
          FS_URL="http://127.0.0.1:4096/api/fs/find?query=*&location[directory]=/data/user/0/${{ env.EXPECTED_PACKAGE_ID }}/files/home/work"
          FS_RESPONSE=$(adb shell "$HTTP_CMD -u opencode:test '$FS_URL'" 2>/dev/null)
          FS_HTTP_CODE=$(adb shell "curl -s -o /dev/null -w '%{http_code}' -u opencode:test '$FS_URL'" 2>/dev/null || echo "000")
          echo "FS HTTP Code: $FS_HTTP_CODE"
          echo "FS Response: $FS_RESPONSE"
          
          if [ "$FS_HTTP_CODE" = "200" ] && echo "$FS_RESPONSE" | grep -q '"data"'; then
            echo "✅ /api/fs/find OK (HTTP 200, JSON válido)"
            echo "fs_find_ok=true" >> $GITHUB_OUTPUT
          else
            echo "❌ /api/fs/find FAIL (HTTP: $FS_HTTP_CODE)"
            echo "fs_find_ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Test 2: Verificar ripgrep nativo vía run-as
          RG_OUTPUT=$(adb shell run-as ${{ env.EXPECTED_PACKAGE_ID }} /data/app/${{ env.EXPECTED_PACKAGE_ID }}*/lib/arm64/librg.so --version 2>&1)
          RG_EXIT=$?
          echo "rg version: $RG_OUTPUT"
          
          if [ $RG_EXIT -eq 0 ] && echo "$RG_OUTPUT" | grep -q "ripgrep 15.1.0"; then
            echo "✅ ripgrep ejecutándose nativamente en contexto app"
            echo "rg_native_ok=true" >> $GITHUB_OUTPUT
          else
            echo "❌ ripgrep no ejecuta nativamente en contexto app (exit: $RG_EXIT)"
            echo "rg_native_ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Capturar logs como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-emulator-logs
          path: |
            /tmp/emulator.log
          retention-days: 7

# ===================================================================
# 6. FIREBASE TEST LAB (SOLO SI CONFIGURADO Y AUTORIZADO EXPLÍCITAMENTE)
# ===================================================================
  firebase-testlab-tests:
    name: Pruebas en Dispositivos Físicos ARM64 (Firebase Test Lab)
    needs: [check-arm64-capabilities, fetch-and-verify-apk]
    if: needs.check-arm64-capabilities.outputs.firebase_testlab_configured == 'true' && github.event.inputs.run_firebase_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      firebase_test_ok: ${{ steps.firebase_test.outputs.firebase_test_ok }}
      test_type: ${{ steps.firebase_test.outputs.test_type }}
      test_matrix_id: ${{ steps.firebase_test.outputs.test_matrix_id }}
    steps:
      - name: Validar credenciales Firebase
        run: |
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ] || [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "ERROR: Credenciales Firebase no configuradas"
            exit 1
          fi
          echo "✅ Credenciales validadas"

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          install_components: 'firebase-test-lab'

      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: apk-test-asset
          path: /tmp/

      - name: Verificar SHA-256
        env:
          EXPECTED_SHA256: ${{ needs.fetch-and-verify-apk.outputs.sha256 }}
        run: |
          CALCULATED=$(sha256sum "/tmp/${{ env.APK_NAME }}" | cut -d' ' -f1)
          if [ "$CALCULATED" != "$EXPECTED_SHA256" ]; then
            exit 1
          fi

      - name: Consultar modelos ARM64 disponibles
        id: list_models
        run: |
          MODELS=$(gcloud firebase test android models list --filter="cpu_abi:arm64-v8a" --format="json" 2>&1)
          echo "$MODELS" > /tmp/models.json
          echo "Modelos ARM64 disponibles:"
          echo "$MODELS" | jq -r '.[] | "\(.model_id) - \(.name) - API \(.version_id)"' 2>/dev/null || echo "$MODELS"
          
          # Seleccionar primer modelo disponible
          MODEL_ID=$(echo "$MODELS" | jq -r '.[0].model_id' 2>/dev/null)
          VERSION_ID=$(echo "$MODELS" | jq -r '.[0].version_id' 2>/dev/null)
          if [ -n "$MODEL_ID" ] && [ "$MODEL_ID" != "null" ]; then
            echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT
            echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT
          else
            echo "❌ No hay modelos ARM64 disponibles"
            exit 1
          fi

      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: apk-test-asset
          path: /tmp/

      - name: Verificar SHA-256
        env:
          EXPECTED_SHA256: ${{ needs.fetch-and-verify-apk.outputs.sha256 }}
        run: |
          CALCULATED=$(sha256sum "/tmp/${{ env.APK_NAME }}" | cut -d' ' -f1)
          if [ "$CALCULATED" != "$EXPECTED_SHA256" ]; then
            exit 1
          fi

      - name: Ejecutar test de instalación en Firebase Test Lab
        id: firebase_test
        env:
          MODEL_ID: ${{ steps.list_models.outputs.model_id }}
          VERSION_ID: ${{ steps.list_models.outputs.version_id }}
        run: |
          echo "=== Ejecutando test de instalación (Robo) en Firebase Test Lab ==="
          echo "Modelo: $MODEL_ID"
          echo "API: $VERSION_ID"
          
          gcloud firebase test android run \
            --type=robo \
            --app="/tmp/${{ env.APK_NAME }}" \
            --device=model=$MODEL_ID,version=$VERSION_ID,locale=en,orientation=portrait \
            --timeout=5m \
            --results-bucket=gs://${{ secrets.FIREBASE_PROJECT_ID }}-test-lab \
            --results-dir=fase3b2-${{ github.run_number }} \
            --directories-to-pull=/sdcard/Download,/data/local/tmp \
            2>&1 | tee /tmp/firebase_test.log
          
          # Obtener ID de la matriz de prueba de ESTA ejecución
          TEST_MATRIX_ID=$(gcloud firebase test android list --format="value(test_matrix_id)" --limit=1 2>/dev/null)
          echo "Test Matrix ID: $TEST_MATRIX_ID"
          echo "test_matrix_id=$TEST_MATRIX_ID" >> $GITHUB_OUTPUT
          
          # Esperar y obtener resultados de ESTA matriz
          gcloud firebase test android describe "$TEST_MATRIX_ID" --format="json" > /tmp/firebase_result.json 2>&1
          
          # Verificar si la instalación fue exitosa
          if cat /tmp/firebase_result.json | grep -q '"outcome": "SUCCESS"'; then
            echo "firebase_test_ok=true" >> $GITHUB_OUTPUT
            echo "test_type=install_robo" >> $GITHUB_OUTPUT
          else
            echo "firebase_test_ok=false" >> $GITHUB_OUTPUT
            echo "test_type=install_robo" >> $GITHUB_OUTPUT
          fi

      - name: Subir logs Firebase como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-testlab-logs
          path: |
            /tmp/firebase_test.log
            /tmp/firebase_result.json
          retention-days: 30

# ===================================================================
# 7. REPORTE FINAL CONSOLIDADO
# ===================================================================
  final-report:
    name: Reporte Final Consolidado
    needs: [check-arm64-capabilities, fetch-and-verify-apk, static-tests, prepare-release, functional-tests-arm64, firebase-testlab-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generar reporte consolidado
        env:
          KVM_AVAILABLE: ${{ needs.check-arm64-capabilities.outputs.kvm_available }}
          TCG_POSSIBLE: ${{ needs.check-arm64-capabilities.outputs.tcg_mode_possible }}
          EMULATOR_AVAILABLE: ${{ needs.check-arm64-capabilities.outputs.android_emulator_arm64 }}
          FIREBASE_CONFIGURED: ${{ needs.check-arm64-capabilities.outputs.firebase_testlab_configured }}
          STATIC_RESULT: ${{ needs.static-tests.result }}
          RELEASE_RESULT: ${{ needs.prepare-release.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional-tests-arm64.result }}
          FIREBASE_RESULT: ${{ needs.firebase-testlab-tests.result }}
          PACKAGE: ${{ needs.fetch-and-verify-apk.outputs.package }}
          VERSION: ${{ needs.fetch-and-verify-apk.outputs.version_name }}
          ABI: ${{ needs.fetch-and-verify-apk.outputs.abi }}
          TARGET_SDK: ${{ needs.fetch-and-verify-apk.outputs.target_sdk }}
          SHA256: ${{ needs.fetch-and-verify-apk.outputs.sha256 }}
          EMULATOR_READY: ${{ needs.functional-tests-arm64.outputs.emulator_ready }}
          APK_INSTALLED: ${{ needs.functional-tests-arm64.outputs.apk_installed }}
          RG_NATIVE: ${{ needs.functional-tests-arm64.outputs.rg_native_ok }}
          FS_FIND_OK: ${{ needs.functional-tests-arm64.outputs.fs_find_ok }}
          FIREBASE_OK: ${{ needs.firebase-testlab-tests.outputs.firebase_test_ok }}
          FIREBASE_TYPE: ${{ needs.firebase-testlab-tests.outputs.test_type }}
        run: |
          # Calcular estados condicionales en Bash real
          if [ "$KVM_AVAILABLE" = "false" ]; then
            KVM_STATUS="ACTIVO"
            KVM_SOLUTION="Self-hosted runner ARM64 con KVM"
          else
            KVM_STATUS="RESUELTO"
            KVM_SOLUTION="N/A"
          fi
          
          if [ "$TCG_POSSIBLE" = "true" ]; then
            TCG_STATUS="ACTIVO (inutilizable)"
          else
            TCG_STATUS="N/A"
          fi
          
          if [ "$FIREBASE_CONFIGURED" = "false" ]; then
            FIREBASE_STATUS="ACTIVO"
            FIREBASE_SOLUTION="Agregar secrets FIREBASE_PROJECT_ID + GCP_SA_KEY"
          else
            FIREBASE_STATUS="CONFIGURADO"
            FIREBASE_SOLUTION="N/A"
          fi
          
          cat << EOF > fase3b2-e2e-final-report.md
          # Reporte Final Fase 3B-2 E2E Tests
          
          **Fecha:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Commit:** ${{ github.sha }}
          **Rama:** ${{ github.ref_name }}
          **APK:** ${{ env.APK_NAME }}
          **SHA-256:** ${{ env.APK_SHA256 }}
          **Package ID:** ${PACKAGE}
          **Version:** ${VERSION}
          **ABI:** ${ABI}
          **Target SDK:** ${TARGET_SDK}
          
          ## Capacidades Reales Verificadas (Runner ARM64)
          
          | Capacidad | Estado | Evidencia |
          |-----------|--------|-----------|
          | Runner ARM64 nativo | ✅ | \`ubuntu-22.04-arm\` |
          | KVM disponible | ${KVM_AVAILABLE} | \`/dev/kvm\` |
          | QEMU TCG (software) | ${TCG_POSSIBLE} | \`qemu-system-aarch64 -accel tcg\` |
          | Android Emulator ARM64 | ${EMULATOR_AVAILABLE} | System images |
          | Firebase Test Lab | ${FIREBASE_CONFIGURED} | Secrets configurados |
          
          ## Conclusión Técnica
          
          ### Si KVM DISPONIBLE (${KVM_AVAILABLE}):
          - ✅ Emulador ARM64 nativo FUNCIONAL
          - ✅ Pruebas funcionales EJECUTABLES
          - ✅ Pruebas HTTP reales POSIBLES
          
          ### Si KVM NO DISPONIBLE (caso actual GitHub):
          - ❌ Emulador ARM64 nativo IMPOSIBLE
          - ❌ QEMU TCG disponible pero INUTILIZABLE para CI (10-50x lento, boot >30min)
          - ✅ Alternativa: **Firebase Test Lab** (dispositivos físicos ARM64 reales)
          - ✅ Alternativa: **Self-hosted runner ARM64 + dispositivo físico ADB**
          
          ## Pruebas Ejecutadas
          
          ### 1. Pruebas Estáticas (x86_64) - ${STATIC_RESULT}
          - ✅ SHA-256 verificado: \`${SHA256}\`
          - ✅ Package ID: \`${PACKAGE}\`
          - ✅ ABI: \`${ABI}\`
          - ✅ \`librg.so\` presente en \`lib/arm64-v8a/\`
          - ⚠️ **NO ejecutan código nativo**
          
          ### 2. Release (opcional) - ${RELEASE_RESULT}
          - Draft prerelease creado: \`fase3b2-test-\${{ github.run_number }}\`
          
          ### 3. Pruebas Funcionales ARM64 (KVM) - ${FUNCTIONAL_RESULT}
          - KVM: ${KVM_AVAILABLE}
          - Emulador boot: ${EMULATOR_READY:-'N/A (job omitido)'}
          - APK instalado: ${APK_INSTALLED:-'N/A'}
          - ripgrep nativo (run-as): ${RG_NATIVE:-'N/A'}
          - /api/fs/find: ${FS_FIND_OK:-'N/A'}
          - ripgrep nativo (HTTP context): ${RG_NATIVE_HTTP:-'N/A'}
          
          ### 4. Firebase Test Lab (Dispositivos Físicos) - ${FIREBASE_RESULT}
          - Configurado: ${FIREBASE_CONFIGURED}
          - Test ejecución: ${FIREBASE_OK:-'N/A (job omitido)'}
          - Tipo test: ${FIREBASE_TYPE:-'N/A'}
          - ⚠️ Robo Test ≠ Prueba funcional del motor OpenCode
          
          ## Bloqueos Pendientes
          
          | Bloqueo | Estado | Solución |
          |---------|--------|----------|
          | GitHub Actions sin KVM | ${KVM_STATUS} | Self-hosted runner ARM64 con KVM |
          | Emulador ARM64 en TCG | ${TCG_STATUS} | No usar para CI (lento) |
          | Firebase Test Lab no configurado | ${FIREBASE_STATUS} | Agregar secrets FIREBASE_PROJECT_ID + GCP_SA_KEY |
          | Self-hosted runner ARM64 | **ACTIVO** | Configurar runner ARM64 bare-metal |
          
          ## Costos Estimados Alternativas
          
          | Opción | Costo Mensual (estimado) | Complejidad | Dispositivos ARM64 Reales |
          |--------|-------------------------|-------------|---------------------------|
          | Firebase Test Lab | \$0-50 (Spark/Blaze) | Baja | Sí (Pixel, Samsung, etc.) |
          | AWS Device Farm | \$0.17/min/device | Media | Sí |
          | Self-hosted ARM64 runner + ADB | Hardware (\$200-500) | Media | Sí (tus dispositivos) |
          | Corellium Cloud | \$1000+/mes | Alta | Sí (virtualizados) |
          | Genymotion Cloud | \$0.10-0.50/min | Media | Sí |
          
          ## Recomendación Inmediata
          
          1. **Configurar Firebase Test Lab** (gratis en tier Spark, 5 tests/día)
          2. **Configurar self-hosted runner ARM64** con dispositivo físico ADB
          3. **Documentar procedimiento manual** para validación local
          
          ## Evidencias (Artifacts)
          - \`apk-test-asset\`: APK verificado
          - \`arm64-emulator-logs\`: Logs emulador (si KVM)
          - \`firebase-testlab-logs\`: Resultados Firebase (si configurado)
          - \`fase3b2-e2e-final-report\`: Este reporte
          
          EOF
          cat fase3b2-e2e-final-report.md

      - name: Subir reporte final como artifact
        uses: actions/upload-artifact@v4
        with:
          name: fase3b2-e2e-final-report
          path: fase3b2-e2e-final-report.md
          retention-days: 30

      - name: Resumen en summary
        run: |
          echo "## Resumen Fase 3B-2 E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Descargar y verificar APK | ${{ needs.fetch-and-verify-apk.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas Estáticas (x86_64) | ${{ needs.static-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Preparar Release (opcional) | ${{ needs.prepare-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verificar capacidades ARM64 | ${{ needs.check-arm64-capabilities.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pruebas Funcionales ARM64 (KVM) | ${{ needs.functional-tests-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Test Lab (físicos) | ${{ needs.firebase-testlab-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Conclusión:** GitHub Actions runners ARM64 **no tienen KVM** → emulador ARM64 nativo **no funcional**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Alternativas viables:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Firebase Test Lab (gratis, dispositivos físicos ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "2. Self-hosted runner ARM64 + dispositivo físico ADB" >> $GITHUB_STEP_SUMMARY
          echo "3. AWS Device Farm / Corellium (pago)" >> $GITHUB_STEP_SUMMARY